<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - MAROO GAMER</title>
    <style>
        body {
            background: #0a0a0a;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #333;
            border-radius: 10px;
        }
        .live-count {
            font-size: 2rem;
            color: #ff1493;
            font-weight: bold;
        }
        .music-button {
            background: #ff1493;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
        }
        .model-container {
            height: 400px;
            border-radius: 15px;
            overflow: hidden;
            background: transparent;
            margin: 20px 0;
        }
        .sketchfab-embed-wrapper {
            width: 100%;
            height: 100%;
        }
        .sketchfab-embed-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <h1>🎮 MAROO GAMER - Test Page</h1>
    
    <div class="test-section">
        <h2>🎵 Music Test</h2>
        <audio id="backgroundMusic" loop preload="auto">
            <source src="used sources/background-music.mp3" type="audio/mpeg">
        </audio>
        <button id="musicToggle" class="music-button">🔇 Click to Play Music</button>
        <p>Status: <span id="musicStatus">Ready</span></p>
    </div>
    
    <div class="test-section">
        <h2>📊 Live Count Test</h2>
        <div>
            <div>TikTok Followers: <span class="live-count" id="tiktok-followers">9,543</span></div>
            <div>TikTok Likes: <span class="live-count" id="tiktok-likes">30,000</span></div>
            <div>Total Views: <span class="live-count" id="total-views">750,000</span></div>
        </div>
    </div>
    
    <div class="test-section">
        <h2>🎮 PS5 Controller Test</h2>
        <div class="model-container">
            <div class="sketchfab-embed-wrapper">
                <iframe 
                    title="PlayStation 5 DualSense" 
                    frameborder="0" 
                    allowfullscreen 
                    mozallowfullscreen="true" 
                    webkitallowfullscreen="true" 
                    allow="autoplay; fullscreen; xr-spatial-tracking" 
                    xr-spatial-tracking 
                    execution-while-out-of-viewport 
                    execution-while-not-rendered 
                    web-share 
                    src="https://sketchfab.com/models/878c1f882808477ab81c2fe86d5a3936/embed?autostart=1&ui_theme=dark&ui_controls=1&ui_infos=0&ui_inspector=0&ui_stop=0&ui_watermark=0&ui_watermark_link=0">
                </iframe>
            </div>
        </div>
    </div>

    <script>
        // Simple music test
        const musicToggle = document.getElementById('musicToggle');
        const backgroundMusic = document.getElementById('backgroundMusic');
        const musicStatus = document.getElementById('musicStatus');
        let isPlaying = false;

        musicToggle.addEventListener('click', () => {
            if (isPlaying) {
                backgroundMusic.pause();
                musicToggle.textContent = '🔇 Click to Play Music';
                musicStatus.textContent = 'Paused';
                isPlaying = false;
            } else {
                backgroundMusic.play().then(() => {
                    musicToggle.textContent = '🔊 Click to Pause Music';
                    musicStatus.textContent = 'Playing';
                    isPlaying = true;
                }).catch(error => {
                    musicStatus.textContent = 'Error: ' + error.message;
                });
            }
        });

        // Simple live counter test
        class SimpleLiveCounter {
            constructor() {
                this.counters = {
                    'tiktok-followers': { current: 9543, increment: [1, 2] },
                    'tiktok-likes': { current: 30000, increment: [3, 8] },
                    'total-views': { current: 750000, increment: [5, 25] }
                };
                this.start();
            }

            start() {
                setInterval(() => {
                    Object.keys(this.counters).forEach(id => {
                        const counter = this.counters[id];
                        const increment = Math.floor(Math.random() * (counter.increment[1] - counter.increment[0] + 1)) + counter.increment[0];
                        counter.current += increment;
                        
                        const element = document.getElementById(id);
                        if (element) {
                            element.textContent = counter.current.toLocaleString();
                            element.style.color = '#00ff88';
                            setTimeout(() => {
                                element.style.color = '#ff1493';
                            }, 1000);
                        }
                    });
                }, 10000); // Update every 10 seconds for testing
            }
        }

        // Start live counter
        new SimpleLiveCounter();
    </script>
</body>
</html>
